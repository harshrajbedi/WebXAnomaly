<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebXAnomaly</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Page Styling */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #000; /* Black background */
            color: #fff; /* White text */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            background-color: #1c1c1e; /* Dark gray for contrast */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 3rem;
            font-weight: bold;
            color: #ffffff; /* White title */
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        /* Form Styling */
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .upload-btn-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            margin-bottom: 20px;
        }

        .btn-upload {
            border: 2px solid #0071e3;
            color: white;
            background-color: #0071e3;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            text-transform: uppercase;
        }

        .btn-upload:hover {
            background-color: #005bb5; /* Darker blue on hover */
        }

        .upload-btn-wrapper input[type=file] {
            font-size: 100px;
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
        }

        /* Submit Button */
        button[type="submit"] {
            background-color: #0071e3;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            border: none;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button[type="submit"]:hover {
            background-color: #005bb5;
        }

        /* Footer */
        footer {
            margin-top: 20px;
            font-size: 0.9rem;
            color: #888;
        }

        footer a {
            color: #0071e3;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>Upload PCAP File</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <!-- File Input Button -->
            <div class="upload-btn-wrapper">
                <button class="btn-upload">Choose File</button>
                {{ form.file }}
            </div>
            <!-- Submit Button -->
            <button type="submit">Upload</button>
        </form>
        <footer>
            <p>Created by <a href="#">Harshraj Singh Bedi</a> | WebXAnomaly &copy; 2024</p>
        </footer>
    </div>

</body>
</html>
